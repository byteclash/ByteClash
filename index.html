<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizPulse Simple</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body style="font-family: sans-serif; text-align: center; padding: 40px; background: #0b0f19; color: white;">

  <h1>QuizPulse</h1>

  <!-- Pantalla de Ingreso -->
  <div id="setup">
    <input id="name" placeholder="Tu Apodo" style="padding: 10px; font-size: 16px;">
    <button onclick="entrar()" style="padding: 10px 20px; font-size: 16px;">Entrar</button>
  </div>

  <!-- Pantalla del Juego -->
  <div id="game" style="display:none;">
    <h2 id="user"></h2>
    <h3 id="score" style="color: #00f0ff; font-size: 30px;">Puntos: 0</h3>
    <button onclick="ganarPuntos()" style="padding: 15px 30px; font-size: 18px; background: #ffe600; font-weight: bold;">+100 Puntos</button>
  </div>

  <script>
    const socket = io();
    
    // Obtener o crear token único de sesión guardado en el navegador móvil
    let token = localStorage.getItem('user_token') || 'usr_' + Math.random().toString(36).substr(2, 9);
    localStorage.setItem('user_token', token);

    function entrar() {
      const name = document.getElementById('name').value;
      if (!name) return;
      localStorage.setItem('user_name', name);
      socket.emit('join_or_reconnect', { token, name });
    }

    function ganarPuntos() {
      socket.emit('add_points', { token });
    }

    // Auto-reconectar al volver la señal de internet
    socket.on('connect', () => {
      const savedName = localStorage.getItem('user_name');
      if (savedName) {
        socket.emit('join_or_reconnect', { token, name: savedName });
      }
    });

    // Actualizar pantalla con los puntos restaurados
    socket.on('player_state', (data) => {
      document.getElementById('setup').style.display = 'none';
      document.getElementById('game').style.display = 'block';
      document.getElementById('user').innerText = 'Jugador: ' + data.name;
      document.getElementById('score').innerText = 'Puntos: ' + data.score;
    });
  </script>
</body>
</html>
